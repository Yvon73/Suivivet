{% load static %}
<!DOCTYPE html>
<html lang="fr">
<script>
    (function () {
        try {
            var html = document.documentElement;
            var taille = localStorage.getItem('a11yTaille');
            if (taille === 'grand') { html.classList.add('a11y-taille-grand'); }
            if (taille === 'tres-grand') { html.classList.add('a11y-taille-tres-grand'); }
            if (localStorage.getItem('a11yContraste') === '1') { html.classList.add('a11y-contraste'); }
            if (localStorage.getItem('a11yPolice') === '1') { html.classList.add('a11y-police-lisible'); }
            if (localStorage.getItem('a11yReduireAnimations') === '1') { html.classList.add('a11y-reduire-animations'); }
            if (localStorage.getItem('a11yPaletteDaltonisme') === '1') { html.classList.add('a11y-palette-daltonisme'); }
        } catch (e) {}
    })();
</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe réinitialisé - Suivi Vétérinaire</title>

    <!-- Favicon -->
    <link rel="icon" href="{% static 'favicon.ico' %}" sizes="any">
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible&display=swap">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
<a class="visually-hidden-focusable btn btn-primary position-absolute m-2" href="#contenu-principal">
    Aller au contenu principal
</a>

<div class="position-absolute top-0 end-0 m-3">
    {% include 'partials/panneau_accessibilite.html' with bouton_classe='btn-outline-secondary' %}
</div>

<div class="container" id="contenu-principal">
    <div class="row justify-content-center w-100">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header">
                    <h4>Mot de passe réinitialisé</h4>
                </div>
                <div class="card-body">
                    <p>Ton mot de passe a bien été changé. Tu peux maintenant te connecter.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary">Se connecter</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/accessibilite.js' %}"></script>
</body>
</html>
