{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>{% block title %}Suivi Vétérinaire{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#ecf0f1; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:#333333;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ecf0f1;">
<tr>
<td align="center" style="padding:24px 16px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:8px; overflow:hidden; box-shadow:0 4px 6px rgba(0,0,0,0.1);">
<tr>
<td style="background-color:#2c3e50; padding:24px 32px; text-align:center;">
<img src="cid:logo_entete" width="56" height="56" alt="Suivi Vétérinaire" style="display:block; margin:0 auto 10px; border-radius:50%; border:0;">
<span style="color:#ffffff; font-size:20px; font-weight:700; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">Suivi Vétérinaire</span>
</td>
</tr>
<tr>
<td style="padding:32px; font-size:15px; line-height:1.6; color:#333333;">
{% block contenu %}{% endblock %}
</td>
</tr>
<tr>
<td style="background-color:#f5f5f5; padding:16px 32px; text-align:center; font-size:12px; color:#7f8c8d; border-top:1px solid #e0e0e0;">
Cet email a été envoyé automatiquement par Suivi Vétérinaire, application personnelle de suivi de vos animaux.
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
