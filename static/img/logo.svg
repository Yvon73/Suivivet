    <path d="M0,33 Q0,42 14,44" fill="none" stroke="#1D3557" stroke-width="4" stroke-linecap="round" />
    <path d="M-15,18 L-55,8 M-15,25 L-58,25 M15,18 L55,8 M15,25 L58,25" stroke="#1D3557" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Chien -->
  <g transform="translate(625,625)">
    <circle r="115" class="badge" />
    <path d="M-58,-58 Q-98,-18 -76,46 Q-60,56 -54,12 Q-50,-30 -58,-58 Z" class="dark" />
