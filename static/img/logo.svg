  <g transform="translate(625,875)">
    <circle r="115" class="badge" />
    <path d="M-48,-35 Q0,-62 48,-35 Q44,25 0,55 Q-44,25 -48,-35 Z" class="dark" />
    <ellipse class="eyeW" cx="-22" cy="-22" rx="9" ry="12" />
