    <circle r="115" class="badge" />
    <path d="M-30,-15 Q-70,-30 -100,-15" fill="none" stroke="#1D3557" stroke-width="8" stroke-linecap="round" />
    <path d="M-32,0 Q-75,0 -102,15" fill="none" stroke="#1D3557" stroke-width="8" stroke-linecap="round" />
    <path d="M-30,18 Q-68,35 -92,58" fill="none" stroke="#1D3557" stroke-width="8" stroke-linecap="round" />
    <path d="M-24,34 Q-55,58 -72,88" fill="none" stroke="#1D3557" stroke-width="8" stroke-linecap="round" />
    <path d="M30,-15 Q70,-30 100,-15" fill="none" stroke="#1D3557" stroke-width="8" stroke-linecap="round" />
    <path d="M32,0 Q75,0 102,15" fill="none" stroke="#1D3557" stroke-width="8" stroke-linecap="round" />
    <path d="M30,18 Q68,35 92,58" fill="none" stroke="#1D3557" stroke-width="8" stroke-linecap="round" />
    <path d="M24,34 Q55,58 72,88" fill="none" stroke="#1D3557" stroke-width="8" stroke-linecap="round" />
    <circle class="dark" cx="0" cy="30" r="46" />
    <circle class="dark" cx="0" cy="-22" r="28" />
    <circle class="eyeW" cx="-11" cy="-28" r="6" />
    <circle class="eyeW" cx="11" cy="-28" r="6" />
    <circle class="eyeW" cx="-18" cy="-16" r="4.5" />
