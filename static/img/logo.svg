<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <title>Projet Véto — électrocardiogramme, stéthoscope et animaux de compagnie</title>

  <defs>
    <style>
      .badge  { fill:#2A9D8F; stroke:#FFFFFF; stroke-width:6; }
      .dark   { fill:#1D3557; }
      .eyeW   { fill:#FFFFFF; }
      .eyeD   { fill:#1D3557; }
      .ekg    { fill:none; stroke:#E63946; stroke-width:16; stroke-linecap:round; stroke-linejoin:round; }
      .steth  { fill:none; stroke:#1D3557; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; }
      .stethFill { fill:#1D3557; }
      .stethRing { fill:none; stroke:#1D3557; stroke-width:15; }
    </style>
  </defs>

  <!-- ===== Bandeau haut : électrocardiogramme + stéthoscope superposé (compressés verticalement pour laisser toute la place aux animaux) ===== -->
  <g transform="scale(1,0.8)">
    <path class="ekg" d="M30,280 L90,280 Q130,250 170,280 L210,280 L230,300 L255,110 L285,330 L315,280
                          L360,280 Q400,235 440,280 L490,280 L550,280 Q590,250 630,280 L670,280 L690,300
                          L715,110 L745,330 L775,280 L820,280 Q860,235 900,280 L950,280" />
    <ellipse class="stethFill" cx="300" cy="72" rx="19" ry="28" />
    <ellipse class="stethFill" cx="440" cy="72" rx="19" ry="28" />
    <path class="steth" d="M300,97 C300,182 330,222 372,258" />
    <path class="steth" d="M440,97 C440,182 410,222 372,258" />
    <path class="steth" d="M372,258 C455,300 555,278 650,300 C722,317 682,402 620,480 C600,508 610,538 616,556" />
    <circle class="stethRing" cx="620" cy="574" r="56" />
    <circle class="stethFill" cx="620" cy="574" r="28" />
  </g>

  <!-- ===== Premier plan : médaillons-visages des animaux, grille 4x2, grande taille ===== -->

  <!-- Perroquet -->
  <g transform="translate(125,625)">
    <circle r="115" class="badge" />
    <polygon points="-14,-88 -4,-122 6,-90" class="dark" />
    <polygon points="4,-92 16,-128 24,-92" class="dark" />
    <polygon points="20,-84 34,-116 42,-86" class="dark" />
    <circle class="eyeW" cx="-24" cy="-10" r="16" />
    <circle class="eyeD" cx="-19" cy="-10" r="8" />
    <polygon points="8,-20 70,4 22,24" class="dark" />
    <polygon points="22,24 48,30 24,42" class="dark" />
  </g>

  <!-- Chat -->
  <g transform="translate(375,625)">
    <circle r="115" class="badge" />
    <polygon points="-58,-95 -78,-32 -16,-68" class="dark" />
    <polygon points="58,-95 78,-32 16,-68" class="dark" />
    <polygon points="-48,-78 -60,-42 -28,-60" class="badge" />
    <polygon points="48,-78 60,-42 28,-60" class="badge" />
    <ellipse class="eyeD" cx="-30" cy="-8" rx="15" ry="11" />
    <ellipse class="eyeD" cx="30" cy="-8" rx="15" ry="11" />
    <circle class="eyeW" cx="-25" cy="-12" r="3.5" />
