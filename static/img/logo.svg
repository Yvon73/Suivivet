  </g>

  <!-- Furet -->
  <g transform="translate(125,875)">
    <circle r="115" class="badge" />
    <circle cx="-46" cy="-76" r="20" class="dark" />
    <circle cx="46" cy="-76" r="20" class="dark" />
    <ellipse cx="-26" cy="-8" rx="24" ry="20" class="dark" />
    <ellipse cx="26" cy="-8" rx="24" ry="20" class="dark" />
    <circle class="eyeW" cx="-26" cy="-8" r="9" />
