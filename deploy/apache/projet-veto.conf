# VirtualHost HTTP (port 80) pour un acces par IP nue, sans TLS pour
# l'instant (voir l'avertissement dans Projet_veto/production.env). Des que
# tu as un nom de domaine + un certificat (ex: certbot --apache), duplique ce
# fichier en un VirtualHost *:443 avec SSLEngine on, et decommente les lignes
# X-Forwarded-* ci-dessous en passant BEHIND_REVERSE_PROXY=True cote .env.
#
# Modules Apache requis : proxy, proxy_http, headers
#   sudo a2enmod proxy proxy_http headers
#   sudo a2ensite projet-veto
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName 192.162.68.76
    ServerAdmin dev.python@dfamilly.fr

    ProxyPreserveHost On

    # /media/ et /static/ sont servis directement par Apache (plus rapide que
    # de passer par gunicorn) : on les exclut explicitement du proxy.
    ProxyPass /static/ !
    ProxyPass /media/ !
    ProxyPass / unix:/run/projet-veto/gunicorn.sock|http://localhost/
    ProxyPassReverse / unix:/run/projet-veto/gunicorn.sock|http://localhost/

    # A decommenter uniquement une fois un vrai HTTPS en place devant (443,
    # cf. commentaire en tete de fichier) et BEHIND_REVERSE_PROXY=True :
    # RequestHeader set X-Forwarded-Proto "https"

    # ATTENTION securite : ces fichiers sont serves sans passer par
    # l'authentification Django (LoginRequiredMixin) - quiconque devine ou
    # obtient une URL /media/... (photo, document, facture scannee...) peut y
    # acceder directement, connecte ou non. C'est le comportement standard de
    # Django/whitenoise pour les fichiers medias ; si ca pose probleme pour
    # des documents sensibles, il faudra une vue Django dediee (verifiant la
    # connexion puis renvoyant le fichier, ex: via X-Sendfile) plutot qu'un
    # Alias direct.
    Alias /media/ /opt/projet_veto/media/
    <Directory /opt/projet_veto/media>
        Require all granted
    </Directory>

    Alias /static/ /opt/projet_veto/staticfiles/
    <Directory /opt/projet_veto/staticfiles>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/projet-veto-error.log
    CustomLog ${APACHE_LOG_DIR}/projet-veto-access.log combined
</VirtualHost>
