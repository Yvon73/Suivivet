# A coller dans ISPConfig : Sites > site "suivivet.fr" > onglet "Options" >
# champ "Apache Directives", puis "Enregistrer" (ISPConfig regenere le vhost
# et reinjecte ce bloc automatiquement - pas besoin d'editer les fichiers
# Apache a la main, ISPConfig les ecraserait de toute facon).
#
# Prerequis modules Apache (normalement deja actives sur ce serveur) :
#   a2enmod proxy proxy_http headers
#
# Une fois le DNS de suivivet.fr pointe vers ce VPS, active le Let's Encrypt
# via la case a cocher SSL du site dans ISPConfig (le support ACME est deja
# cable dans le vhost genere). Une fois le certificat obtenu, decommente la
# ligne X-Forwarded-Proto ci-dessous et repasse BEHIND_REVERSE_PROXY=True
# ainsi que SESSION_COOKIE_SECURE/CSRF_COOKIE_SECURE/SECURE_SSL_REDIRECT a
# True dans Projet_veto/.env sur le VPS.

ProxyPreserveHost On

ProxyPass /static/ !
ProxyPass /media/ !
ProxyPass / unix:/run/projet-veto/gunicorn.sock|http://localhost/
ProxyPassReverse / unix:/run/projet-veto/gunicorn.sock|http://localhost/

# RequestHeader set X-Forwarded-Proto "https"

Alias /media/ /opt/projet_veto/media/
<Directory /opt/projet_veto/media>
    Require all granted
</Directory>

Alias /static/ /opt/projet_veto/staticfiles/
<Directory /opt/projet_veto/staticfiles>
    Require all granted
</Directory>
