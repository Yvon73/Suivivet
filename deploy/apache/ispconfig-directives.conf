# A coller dans ISPConfig : Sites > site "suivivet.fr" > onglet "Options" >
# champ "Apache Directives", puis "Enregistrer" (ISPConfig regenere le vhost
# et reinjecte ce bloc automatiquement - pas besoin d'editer les fichiers
# Apache a la main, ISPConfig les ecraserait de toute facon).
#
# Prerequis modules Apache (normalement deja actives sur ce serveur) :
#   a2enmod proxy proxy_http headers
#
# Certificat Let's Encrypt obtenu via la case SSL du site dans ISPConfig :
# X-Forwarded-Proto est actif ci-dessous. Verifier cote VPS que
# BEHIND_REVERSE_PROXY=True ainsi que SESSION_COOKIE_SECURE/
# CSRF_COOKIE_SECURE/SECURE_SSL_REDIRECT=True sont bien positionnes dans
# Projet_veto/.env.
#
# ISPConfig colle ce meme bloc dans les deux VirtualHost generes (:80 et
# :443) : le <If> ci-dessous est necessaire pour ne poser l'en-tete que sur
# les connexions reellement chiffrees, sinon Django croirait aussi les
# requetes HTTP en clair securisees (SECURE_SSL_REDIRECT ne redirigerait
# plus jamais vers HTTPS).

ProxyPreserveHost On

# /media/ n'a PAS d'exception ProxyPass ni d'Alias ici, volontairement : ces
# fichiers (factures, documents, photos d'animaux) sont desormais servis par
# des vues Django authentifiees qui verifient le proprietaire (cf.
# animaux:animal_photo, factures:facture_fichier, documents:document_fichier)
# et non plus par une URL /media/ directe. Un Alias Apache sur /media/ avec
# `Require all granted` contournerait entierement cette verification -
# n'en remets pas un ici, meme pour "simplifier" le service des fichiers.
ProxyPass /static/ !
ProxyPass / unix:/run/projet-veto/gunicorn.sock|http://localhost/
ProxyPassReverse / unix:/run/projet-veto/gunicorn.sock|http://localhost/

<If "%{HTTPS} == 'on'">
    RequestHeader set X-Forwarded-Proto "https"
</If>

Alias /static/ /opt/projet_veto/staticfiles/
<Directory /opt/projet_veto/staticfiles>
    Require all granted
</Directory>
